<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | المكتب العقاري</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F4D03F;
            --gold-dark: #B8960F;
            --bg-dark: #0a0a0f;
            --bg-card: #1a1a24;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: rgba(212, 175, 55, 0.2);
            --accent: #e63946;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        /* ========== 🔐 شريط تقدم الضغط المطول ========== */
        .secret-press-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 3px;
            background: transparent; z-index: 10001;
            pointer-events: none; transition: all 0.1s;
        }
        .secret-press-bar.active {
            background: rgba(212, 175, 55, 0.3);
        }
        .secret-press-bar .fill {
            height: 100%; width: 0%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            transition: width 0.05s linear;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }

        /* ========== 🔐 تلميح سري ========== */
        .secret-hint {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); color: #fff;
            padding: 8px 16px; border-radius: 20px;
            font-size: 0.8rem; z-index: 10002;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
            font-family: 'Tajawal', sans-serif;
            white-space: nowrap;
        }
        .secret-hint.show { opacity: 1; }

        /* ========== 🔐 نافذة دخول المسؤول ========== */
        .admin-login-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 20000; display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(12px); padding: 20px;
        }
        .admin-login-overlay.open { display: flex; }
        
        .admin-login-card {
            background: var(--bg-card);
            border-radius: 24px; padding: 32px 24px; text-align: center;
            max-width: 400px; width: 100%;
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            position: relative;
            animation: modalIn 0.3s ease;
        }
        
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .admin-login-card .admin-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border-radius: 16px; display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: #000; margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(212,175,55,0.4);
        }
        
        .admin-login-card h3 {
            color: var(--text-primary); font-size: 1.2rem; margin-bottom: 16px;
        }
        
        .admin-login-card .auth-step {
            display: none;
        }
        .admin-login-card .auth-step.active {
            display: block;
        }
        
        .admin-login-card .telegram-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 12px; border: 2px solid #0088cc; border-radius: 12px;
            background: linear-gradient(135deg, #0088cc, #0099dd);
            cursor: pointer; font-weight: 700; font-size: 0.9rem;
            font-family: 'Tajawal', sans-serif; color: #fff; transition: all 0.2s;
        }
        .admin-login-card .telegram-btn:hover {
            background: linear-gradient(135deg, #0099dd, #00aaff);
        }
        .admin-login-card .telegram-btn:disabled {
            opacity: 0.6; cursor: not-allowed;
        }
        
        .admin-login-card .otp-input-group {
            display: flex; gap: 8px; justify-content: center; margin: 16px 0;
        }
        .admin-login-card .otp-input {
            width: 46px; height: 50px; text-align: center; font-size: 1.3rem;
            font-weight: 700; border: 2px solid var(--border-color); border-radius: 10px;
            background: var(--bg-dark); color: var(--text-primary); font-family: monospace;
        }
        .admin-login-card .otp-input:focus {
            border-color: #0088cc; outline: none;
        }
        
        .admin-login-card .timer-display {
            color: #f59e0b; font-size: 0.8rem; margin: 8px 0;
        }
        .admin-login-card .resend-link {
            color: #0088cc; cursor: pointer; font-size: 0.8rem;
        }
        .admin-login-card .resend-link.disabled {
            color: var(--text-secondary); cursor: not-allowed; pointer-events: none;
        }
        
        .admin-login-card .error-msg {
            color: #ef4444; font-size: 0.8rem; margin-top: 8px; display: none;
        }
        .admin-login-card .error-msg.show { display: block; }
        
        .admin-login-close {
            position: absolute; top: 12px; left: 12px;
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            font-size: 1rem; display: flex; align-items: center; justify-content: center;
        }
        .admin-login-close:hover { background: var(--accent); }

        /* الشريط الجانبي */
        .sidebar {
            width: 280px;
            background: var(--bg-card);
            padding: 30px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            border-left: 1px solid var(--border-color);
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 50px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
        }

        .nav-item.active {
            background: rgba(212, 175, 55, 0.2);
            border-right: 3px solid var(--gold);
        }

        .nav-item i {
            font-size: 22px;
        }

        .user-info {
            margin-top: auto;
            padding: 20px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
        }

        .user-name {
            font-weight: 700;
        }

        .user-role {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            margin-right: 280px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 900;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 50px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input {
            background: none;
            border: none;
            color: white;
            outline: none;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            width: 300px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        /* الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--gold);
            transform: translateY(-5px);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 24px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .stat-change {
            font-size: 12px;
            font-weight: 600;
        }

        .stat-change.positive {
            color: #4CAF50;
        }

        /* الجداول */
        .table-container {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .table-header {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .table-title {
            font-size: 20px;
            font-weight: 800;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 15px 25px;
            text-align: right;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 15px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-available {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .status-reserved {
            background: rgba(255, 152, 0, 0.2);
            color: #FF9800;
        }

        .status-sold {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
        }

        .action-icons {
            display: flex;
            gap: 10px;
        }

        .action-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            border: none;
            font-size: 16px;
        }

        .action-icon:hover {
            background: var(--gold);
            color: #000;
        }

        /* تنبيه */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--gold);
            padding: 15px 30px;
            border-radius: 12px;
            color: white;
            z-index: 1000;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                padding: 20px;
            }
            .main-content {
                margin-right: 0;
                padding: 20px;
            }
            .admin-login-card .otp-input {
                width: 38px;
                height: 44px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 🔐 شريط تقدم الضغط المطول -->
    <div class="secret-press-bar" id="secret-press-bar"><div class="fill" id="secret-press-fill"></div></div>
    
    <!-- 🔐 تلميح سري -->
    <div class="secret-hint" id="secret-hint"></div>

    <!-- 🔐 نافذة دخول المسؤول -->
    <div class="admin-login-overlay" id="admin-login-overlay">
        <div class="admin-login-card">
            <button class="admin-login-close" id="admin-login-close">&times;</button>
            <div class="admin-icon"><i class="fas fa-shield-halved"></i></div>
            <h3>🔐 دخول المسؤول</h3>
            <div class="auth-step active" id="admin-step-request">
                <p style="color:var(--text-secondary);font-size:0.8rem;margin-bottom:16px;">تحقق سريع عبر Telegram</p>
                <button class="telegram-btn" id="admin-request-code-btn"><i class="fab fa-telegram-plane"></i> طلب كود التحقق</button>
                <div class="error-msg" id="admin-step1-error"></div>
                <div style="color:#22c55e;font-size:0.8rem;margin-top:8px;display:none;" id="admin-step1-success"></div>
            </div>
            <div class="auth-step" id="admin-step-verify">
                <p style="color:var(--text-secondary);font-size:0.8rem;">أدخل الكود المكون من 6 أرقام</p>
                <div class="otp-input-group">
                    <input type="text" class="otp-input" maxlength="1" id="admin-otp-1" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" id="admin-otp-2" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" id="admin-otp-3" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" id="admin-otp-4" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" id="admin-otp-5" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" id="admin-otp-6" inputmode="numeric">
                </div>
                <div class="timer-display" id="admin-timer-display"></div>
                <span class="resend-link disabled" id="admin-resend-link">إعادة الإرسال</span>
                <div class="error-msg" id="admin-step2-error"></div>
            </div>
        </div>
    </div>

    <!-- الشريط الجانبي -->
    <aside class="sidebar">
        <div class="logo" id="secret-admin-trigger">🏢 المكتب العقاري</div>
        
        <nav>
            <a class="nav-item active" onclick="switchTab(this, 'dashboard')">
                <i class="fas fa-th-large"></i>
                لوحة التحكم
            </a>
            <a class="nav-item" onclick="switchTab(this, 'properties')">
                <i class="fas fa-building"></i>
                إدارة العقارات
            </a>
            <a class="nav-item" onclick="switchTab(this, 'clients')">
                <i class="fas fa-users"></i>
                العملاء
            </a>
            <a class="nav-item" onclick="switchTab(this, 'requests')">
                <i class="fas fa-calendar-check"></i>
                طلبات المعاينة
            </a>
            <a class="nav-item" onclick="switchTab(this, 'reports')">
                <i class="fas fa-chart-bar"></i>
                التقارير
            </a>
            <a class="nav-item" onclick="switchTab(this, 'content')">
                <i class="fas fa-pen-to-square"></i>
                إدارة المحتوى
            </a>
            <a class="nav-item" onclick="switchTab(this, 'settings')">
                <i class="fas fa-gear"></i>
                الإعدادات
            </a>
        </nav>
        
        <div class="user-info">
            <div class="user-avatar">أح</div>
            <div>
                <div class="user-name">أحمد المدير</div>
                <div class="user-role">مدير عام</div>
            </div>
        </div>
    </aside>
    
    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <div id="notification" class="notification"></div>
        
        <!-- الهيدر -->
        <div class="header">
            <h1 class="page-title" id="tabTitle">لوحة التحكم</h1>
            <div class="header-actions">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="بحث سريع...">
                </div>
                <button class="btn btn-outline" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    تسجيل الخروج
                </button>
            </div>
        </div>
        
        <!-- محتوى التبويب -->
        <div id="tabContent"></div>
    </main>

    <script>
        (function() {
            // ==================== 🔐 إعدادات الدخول السري ====================
            const TELEGRAM_BOT_TOKEN = '8723447348:AAGtKoujIGCtbLXuPUWAR-B-oweiOdcDCKk';
            const TELEGRAM_CHAT_ID = '6776057443';
            const OTP_KEY = 'telegram_otp_data';
            const LONG_PRESS_DURATION = 3000; // 3 ثواني
            let otpTimer = null, otpTimeLeft = 0;

            // ==================== 🔐 SECRET ADMIN ACCESS ====================
            const secretTrigger = document.getElementById('secret-admin-trigger');
            const pressBar = document.getElementById('secret-press-bar');
            const pressFill = document.getElementById('secret-press-fill');
            const secretHint = document.getElementById('secret-hint');
            let pressStart = 0, pressInterval = null, isPressing = false;

            if (secretTrigger) {
                secretTrigger.addEventListener('mousedown', startSecretPress);
                secretTrigger.addEventListener('touchstart', startSecretPress, { passive: true });
                secretTrigger.addEventListener('mouseup', cancelSecretPress);
                secretTrigger.addEventListener('mouseleave', cancelSecretPress);
                secretTrigger.addEventListener('touchend', cancelSecretPress);
                secretTrigger.addEventListener('touchcancel', cancelSecretPress);
                secretTrigger.addEventListener('dragstart', function(e) { e.preventDefault(); });
            }

            function startSecretPress(e) {
                if (e.type === 'touchstart') e.preventDefault();
                if (isPressing) return;
                isPressing = true;
                pressStart = Date.now();
                pressBar.classList.add('active');
                pressFill.style.width = '0%';
                pressFill.style.transition = 'none';
                
                pressInterval = setInterval(function() {
                    const elapsed = Date.now() - pressStart;
                    const progress = Math.min((elapsed / LONG_PRESS_DURATION) * 100, 100);
                    pressFill.style.width = progress + '%';
                    
                    if (elapsed > 1000 && elapsed < 1300) showSecretHint('🔍 ...');
                    else if (elapsed > 2000 && elapsed < 2300) showSecretHint('🔥 ...');
                    
                    if (elapsed >= LONG_PRESS_DURATION) {
                        cancelSecretPress();
                        showSecretHint('✅ تم الفتح!', 1500);
                        const logoEl = secretTrigger;
                        if (logoEl) { 
                            logoEl.style.transform = 'scale(1.1)'; 
                            logoEl.style.textShadow = '0 0 30px rgba(212,175,55,0.8)'; 
                        }
                        setTimeout(function() { 
                            if (logoEl) { 
                                logoEl.style.transform = ''; 
                                logoEl.style.textShadow = ''; 
                            } 
                        }, 800);
                        setTimeout(function() { openAdminLogin(); }, 500);
                    }
                }, 30);
            }

            function cancelSecretPress() {
                if (!isPressing && !pressInterval) return;
                isPressing = false;
                clearInterval(pressInterval);
                pressInterval = null;
                pressBar.classList.remove('active');
                pressFill.style.transition = 'width 0.3s ease';
                pressFill.style.width = '0%';
                secretHint.classList.remove('show');
            }

            function showSecretHint(msg, duration) {
                if (!duration) duration = 1500;
                secretHint.textContent = msg;
                secretHint.classList.add('show');
                clearTimeout(secretHint._timer);
                if (duration > 0) secretHint._timer = setTimeout(function() { secretHint.classList.remove('show'); }, duration);
            }

            // اختصار لوحة المفاتيح Ctrl+Shift+A
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
                    e.preventDefault();
                    showSecretHint('⌨️ اختصار الدخول', 1500);
                    setTimeout(function() { openAdminLogin(); }, 400);
                }
            });

            // Param في الرابط
            if (new URL(location.href).searchParams.has('admin')) {
                setTimeout(function() { openAdminLogin(); }, 500);
            }

            // ==================== ADMIN LOGIN ====================
            function openAdminLogin() {
                document.getElementById('admin-login-overlay').classList.add('open');
                showAdminStep('request');
                document.getElementById('admin-step1-success').style.display = 'none';
            }
            
            function closeAdminLogin() {
                document.getElementById('admin-login-overlay').classList.remove('open');
                clearInterval(otpTimer);
            }

            function showAdminStep(step) {
                var steps = document.querySelectorAll('.admin-login-card .auth-step');
                for (var i = 0; i < steps.length; i++) {
                    steps[i].classList.remove('active');
                }
                var el = document.getElementById('admin-step-' + step);
                if (el) el.classList.add('active');
                var errors = document.querySelectorAll('.admin-login-card .error-msg');
                for (var j = 0; j < errors.length; j++) {
                    errors[j].textContent = '';
                    errors[j].classList.remove('show');
                }
            }
            
            function showAdminError(elId, msg) {
                var el = document.getElementById(elId);
                if (el) {
                    el.textContent = msg;
                    el.classList.add('show');
                }
            }

            async function adminRequestOTP() {
                var btn = document.getElementById('admin-request-code-btn');
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
                }
                var otp = Math.floor(100000 + Math.random() * 900000).toString();
                sessionStorage.setItem(OTP_KEY, JSON.stringify({ 
                    code: otp, 
                    expires: Date.now() + 300000, 
                    attempts: 0 
                }));
                var msg = '🔐 *رمز تحقق لوحة التحكم*\n\n🔢 الرمز: *' + otp + '*\n⏰ ' + new Date().toLocaleString('ar-EG') + '\n\n_صالح لمدة 5 دقائق_\n_المكتب العقاري_';
                
                try {
                    var r = await fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: msg,
                            parse_mode: 'Markdown'
                        })
                    });
                    var d = await r.json();
                    if (d.ok) {
                        document.getElementById('admin-step1-success').style.display = 'block';
                        document.getElementById('admin-step1-success').textContent = '✅ تم إرسال الرمز إلى تيليجرام';
                        setTimeout(function() {
                            showAdminStep('verify');
                            startAdminTimer(300);
                            document.getElementById('admin-otp-1')?.focus();
                        }, 600);
                    } else {
                        showAdminError('admin-step1-error', '❌ فشل الإرسال - تحقق من اتصال البوت');
                    }
                } catch(e) {
                    showAdminError('admin-step1-error', '❌ فشل الاتصال بالخادم');
                } finally {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fab fa-telegram-plane"></i> طلب كود التحقق';
                    }
                }
            }

            function adminVerifyOTP() {
                var digits = [];
                for (var i = 1; i <= 6; i++) {
                    digits.push(document.getElementById('admin-otp-' + i)?.value || '');
                }
                var entered = digits.join('');
                if (entered.length !== 6) {
                    showAdminError('admin-step2-error', 'أدخل 6 أرقام كاملة');
                    return;
                }
                
                var otpData = JSON.parse(sessionStorage.getItem(OTP_KEY) || '{}');
                if (!otpData.code) {
                    showAdminError('admin-step2-error', 'انتهت صلاحية الرمز - اطلب واحداً جديداً');
                    return;
                }
                if (Date.now() > otpData.expires) {
                    showAdminError('admin-step2-error', 'انتهت صلاحية الرمز');
                    return;
                }
                if (otpData.attempts >= 5) {
                    showAdminError('admin-step2-error', 'تم تجاوز الحد الأقصى للمحاولات');
                    return;
                }
                
                otpData.attempts++;
                sessionStorage.setItem(OTP_KEY, JSON.stringify(otpData));
                
                if (entered === otpData.code) {
                    sessionStorage.removeItem(OTP_KEY);
                    clearInterval(otpTimer);
                    sessionStorage.setItem('admin_verified', 'true');
                    localStorage.setItem('adminToken', 'telegram_verified_' + Date.now());
                    showNotification('✅ تم التحقق بنجاح - مرحباً بك');
                    closeAdminLogin();
                    // إعادة تحميل المحتوى
                    initDashboard();
                } else {
                    showAdminError('admin-step2-error', '❌ رمز غير صحيح - متبقي ' + (5 - otpData.attempts) + ' محاولات');
                    for (var j = 1; j <= 6; j++) {
                        document.getElementById('admin-otp-' + j).value = '';
                    }
                    document.getElementById('admin-otp-1')?.focus();
                }
            }

            function startAdminTimer(s) {
                otpTimeLeft = s;
                updateAdminTimerDisplay();
                clearInterval(otpTimer);
                var rl = document.getElementById('admin-resend-link');
                if (rl) rl.classList.add('disabled');
                otpTimer = setInterval(function() {
                    otpTimeLeft--;
                    updateAdminTimerDisplay();
                    if (otpTimeLeft <= 0) {
                        clearInterval(otpTimer);
                        if (rl) rl.classList.remove('disabled');
                    }
                }, 1000);
            }
            
            function updateAdminTimerDisplay() {
                var m = Math.floor(otpTimeLeft / 60), s = otpTimeLeft % 60;
                var d = document.getElementById('admin-timer-display');
                if (d) d.textContent = '⏰ ' + m + ':' + (s < 10 ? '0' : '') + s;
            }

            // ==================== BIND ADMIN EVENTS ====================
            document.getElementById('admin-login-close')?.addEventListener('click', closeAdminLogin);
            document.getElementById('admin-login-overlay')?.addEventListener('click', function(e) {
                if (e.target === this) closeAdminLogin();
            });
            document.getElementById('admin-request-code-btn')?.addEventListener('click', adminRequestOTP);
            document.getElementById('admin-resend-link')?.addEventListener('click', function() {
                if (otpTimeLeft > 0) return;
                sessionStorage.removeItem(OTP_KEY);
                clearInterval(otpTimer);
                for (var i = 1; i <= 6; i++) {
                    document.getElementById('admin-otp-' + i).value = '';
                }
                showAdminStep('request');
            });
            
            for (var i = 1; i <= 6; i++) {
                var inp = document.getElementById('admin-otp-' + i);
                if (inp) {
                    inp.addEventListener('input', function() {
                        this.value = this.value.replace(/[^0-9]/g, '');
                        if (this.value.length === 1 && i < 6) {
                            document.getElementById('admin-otp-' + (i + 1))?.focus();
                        }
                        if (i === 6 && this.value.length === 1) {
                            setTimeout(adminVerifyOTP, 200);
                        }
                    });
                    inp.addEventListener('keydown', function(e) {
                        if (e.key === 'Backspace' && this.value.length === 0 && i > 1) {
                            document.getElementById('admin-otp-' + (i - 1))?.focus();
                        }
                        if (e.key === 'Enter') adminVerifyOTP();
                    });
                    inp.addEventListener('paste', function(e) {
                        e.preventDefault();
                        var pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                        if (pasted.length === 6) {
                            for (var j = 0; j < 6; j++) {
                                document.getElementById('admin-otp-' + (j + 1)).value = pasted[j];
                            }
                            setTimeout(adminVerifyOTP, 200);
                        }
                    });
                }
            }

            // ==================== DASHBOARD FUNCTIONS ====================
            function checkAuth() {
                // التحقق من التوكن أو الجلسة
                const token = localStorage.getItem('adminToken');
                const sessionVerified = sessionStorage.getItem('admin_verified');
                
                if (!token && !sessionVerified && !window.location.search.includes('demo=true')) {
                    showNotification('يرجى تسجيل الدخول عبر تيليجرام', 'error');
                    setTimeout(function() {
                        openAdminLogin();
                    }, 1500);
                    return false;
                }
                return true;
            }

            function showNotification(message, type) {
                if (!type) type = 'success';
                var notif = document.getElementById('notification');
                notif.textContent = message;
                notif.style.display = 'block';
                if (type === 'error') {
                    notif.style.borderColor = '#F44336';
                } else {
                    notif.style.borderColor = 'var(--gold)';
                }
                setTimeout(function() {
                    notif.style.display = 'none';
                }, 3000);
            }

            function switchTab(element, tabName) {
                var items = document.querySelectorAll('.nav-item');
                for (var i = 0; i < items.length; i++) {
                    items[i].classList.remove('active');
                }
                element.classList.add('active');
                
                var titles = {
                    dashboard: 'لوحة التحكم',
                    properties: 'إدارة العقارات',
                    clients: 'العملاء',
                    requests: 'طلبات المعاينة',
                    reports: 'التقارير',
                    content: 'إدارة المحتوى',
                    settings: 'الإعدادات'
                };
                
                document.getElementById('tabTitle').textContent = titles[tabName];
                var content = document.getElementById('tabContent');
                
                switch(tabName) {
                    case 'dashboard':
                        content.innerHTML = renderDashboard();
                        break;
                    case 'properties':
                        content.innerHTML = renderProperties();
                        break;
                    case 'clients':
                        content.innerHTML = renderClients();
                        break;
                    case 'settings':
                        content.innerHTML = renderSettings();
                        break;
                    default:
                        content.innerHTML = '<div style="text-align:center; padding:100px; color:var(--text-secondary);"><i class="fas fa-gear" style="font-size:64px; margin-bottom:20px; display:block;"></i>جاري تطوير هذا القسم...</div>';
                }
            }

                    '<div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-building"></i></div><span class="stat-change positive">+12%</span></div><div class="stat-value">450</div><div class="stat-label">إجمالي العقارات</div></div>' +
                    '<div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-users"></i></div><span class="stat-change positive">+25%</span></div><div class="stat-value">1,280</div><div class="stat-label">العملاء المسجلين</div></div>' +
                    '<div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-dollar-sign"></i></div><span class="stat-change positive">+18%</span></div><div class="stat-value">320M</div><div class="stat-label">قيمة المبيعات (د.إ)</div></div>' +
                    '<div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-calendar-check"></i></div><span class="stat-change positive">+8%</span></div><div class="stat-value">65</div><div class="stat-label">معاينات هذا الشهر</div></div>' +
                    '</div>' +
                    '<div class="table-container"><div class="table-header"><h3 class="table-title">آخر العقارات المضافة</h3><button class="btn btn-gold" onclick="showNotification(\'خاصية إضافة عقار قيد التطوير\')"><i class="fas fa-plus"></i> إضافة عقار</button></div>' +
                    '<table><thead><tr><th>#</th><th>العقار</th><th>النوع</th><th>الموقع</th><th>السعر</th><th>الحالة</th><th>إجراءات</th></tr></thead>' +
                    '<tbody><tr><td>1</td><td>فيلا نخلة جميرا</td><td>فيلا</td><td>دبي</td><td>85,000,000 د.إ</td><td><span class="status-badge status-available">متاحة</span></td><td><div class="action-icons"><button class="action-icon"><i class="fas fa-pen"></i></button><button class="action-icon"><i class="fas fa-eye"></i></button><button class="action-icon"><i class="fas fa-trash"></i></button></div></td></tr>' +
                    '<tr><td>2</td><td>بنتهاوس داون تاون</td><td>بنتهاوس</td><td>دبي</td><td>45,000,000 د.إ</td><td><span class="status-badge status-reserved">محجوز</span></td><td><div class="action-icons"><button class="action-icon"><i class="fas fa-pen"></i></button><button class="action-icon"><i class="fas fa-eye"></i></button><button class="action-icon"><i class="fas fa-trash"></i></button></div></td></tr>' +
                    '</tbody></table></div>';
            }

            function renderProperties() {
                return '<div class="stats-grid" style="margin-bottom:30px;">' +
                    '<div class="stat-card"><div class="stat-value">450</div><div class="stat-label">إجمالي العقارات</div></div>' +
                    '<div class="stat-card"><div class="stat-value">380</div><div class="stat-label">عقارات متاحة</div></div>' +
                    '<div class="stat-card"><div class="stat-value">45</div><div class="stat-label">عقارات محجوزة</div></div>' +
                    '<div class="stat-card"><div class="stat-value">25</div><div class="stat-label">عقارات مباعة</div></div>' +
                    '</div>' +
                    '<div class="table-container"><div class="table-header"><h3 class="table-title">قائمة العقارات</h3><button class="btn btn-gold"><i class="fas fa-plus"></i> إضافة عقار جديد</button></div>' +
                    '<table><thead><tr><th>صورة</th><th>الاسم</th><th>النوع</th><th>المساحة</th><th>السعر</th><th>الحالة</th><th>إجراءات</th></tr></thead>' +
                    '<tbody><tr><td>🏠</td><td>فيلا السعادة</td><td>فيلا</td><td>12,000 قدم²</td><td>85M د.إ</td><td><span class="status-badge status-available">متاحة</span></td><td><div class="action-icons"><button class="action-icon"><i class="fas fa-pen"></i></button><button class="action-icon"><i class="fas fa-eye"></i></button><button class="action-icon"><i class="fas fa-trash"></i></button></div></td></tr></tbody></table></div>';
            }

            function renderClients() {
                return '<div class="table-container"><div class="table-header"><h3 class="table-title">قائمة العملاء</h3><button class="btn btn-gold"><i class="fas fa-plus"></i> إضافة عميل</button></div>' +
                    '<table><thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>رقم الهاتف</th><th>العقارات المفضلة</th><th>آخر تواصل</th><th>إجراءات</th></tr></thead>' +
                    '<tbody><tr><td>محمد الأحمد</td><td>mohammed@email.com</td><td>+971 50 123 4567</td><td>3 عقارات</td><td>منذ يومين</td><td><div class="action-icons"><button class="action-icon"><i class="fas fa-pen"></i></button><button class="action-icon"><i class="fas fa-envelope"></i></button><button class="action-icon"><i class="fas fa-phone"></i></button></div></td></tr></tbody></table></div>';
            }

            function renderSettings() {
                return '<div style="max-width:800px;">' +
                    '<div class="table-container" style="padding:30px; margin-bottom:20px;">' +
                    '<h3 style="margin-bottom:25px;">إعدادات الموظفين وصلاحيات تيليجرام</h3>' +
                    '<div style="margin-bottom:20px;"><label style="display:block; margin-bottom:8px; font-weight:600;">معرف تيليجرام للموظفين المسموح لهم</label><textarea style="width:100%; background:var(--bg-dark); border:1px solid var(--border-color); color:white; padding:15px; border-radius:12px; font-family:\'Tajawal\',sans-serif; min-height:120px;" placeholder="أدخل معرفات تيليجرام (ID) مفصولة بأسطر جديدة...">123456789\n987654321\n' + TELEGRAM_CHAT_ID + '</textarea></div>' +
                    '<div style="margin-bottom:20px;"><label style="display:block; margin-bottom:8px; font-weight:600;">بوت تيليجرام Token</label><input type="password" style="width:100%; background:var(--bg-dark); border:1px solid var(--border-color); color:white; padding:15px; border-radius:12px; font-family:\'Tajawal\',sans-serif;" value="' + TELEGRAM_BOT_TOKEN + '"></div>' +
                    '<button class="btn btn-gold" onclick="showNotification(\'تم حفظ الإعدادات بنجاح\')"><i class="fas fa-check"></i> حفظ الإعدادات</button></div>' +

                    '<div style="margin-bottom:20px;"><label style="display:block; margin-bottom:8px; font-weight:600;">السمة الافتراضية</label><select style="width:100%; background:var(--bg-dark); border:1px solid var(--border-color); color:white; padding:15px; border-radius:12px; font-family:\'Tajawal\',sans-serif;"><option value="dark">الليلية</option><option value="light">النهارية</option></select></div>' +
                    '<button class="btn btn-gold" onclick="showNotification(\'تم حفظ الإعدادات\')"><i class="fas fa-check"></i> حفظ</button></div></div>';

            function logout() {
                localStorage.removeItem('adminToken');
                sessionStorage.removeItem('admin_verified');
                showNotification('تم تسجيل الخروج بنجاح');
                setTimeout(function() {
                    location.reload();
                }, 1500);
            }

            function initDashboard() {
                var firstNav = document.querySelector('.nav-item.active');
                if (firstNav) {
                    switchTab(firstNav, 'dashboard');
                }
                showNotification('مرحباً بك في لوحة التحكم');
            }

            // ==================== التهيئة ====================
            if (checkAuth()) {
                initDashboard();
            }
            
            console.log('🔐 لوحة تحكم المكتب العقاري - نظام دخول تيليجرام مفعل');
            console.log('📱 اضغط مطولاً على الشعار للدخول (3 ثواني)');
            console.log('⌨️ أو استخدم Ctrl+Shift+A');
            console.log('🔗 أو أضف ?admin إلى الرابط');

            // تعريض الدوال للاستخدام العام
            window.showNotification = showNotification;
            window.switchTab = switchTab;
            window.logout = logout;
        })();
    </script>
